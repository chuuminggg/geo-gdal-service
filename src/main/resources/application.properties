spring.application.name=geogdalservice

# AWS S3 설정 (로컬 개발 시 docker-compose의 LocalStack 사용)
aws.s3.bucket.name=geogdal-files
aws.s3.region=ap-northeast-2
aws.s3.endpoint=${AWS_S3_ENDPOINT:http://localhost:4566}
aws.access.key=${AWS_ACCESS_KEY:test}
aws.secret.key=${AWS_SECRET_KEY:test}

# PostgreSQL + PostGIS (docker-compose up -d)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geogdal}
spring.datasource.username=${DB_USERNAME:geogdal}
spring.datasource.password=${DB_PASSWORD:geogdal}

# 스키마는 Flyway 마이그레이션(db/migration)이 관리
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 업로드 제한
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# 대량 적재(road_link, poi) batch insert 를 multi-row insert 로 재작성
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# 파이프라인 (검수/가공) 전용 스레드 풀
pipeline.executor.pool-size=2
pipeline.executor.queue-capacity=100

# 고도 조회 기본 DEM 데이터셋 이름 (dataset 파라미터 생략 시 사용)
geo.elevation.default-dataset=${ELEVATION_DATASET:}

# 경로탐색: 기본 도로 네트워크 데이터셋, 스냅 허용 거리, 경사 반영용 DEM (기본: 고도 조회 DEM)
geo.routing.default-dataset=${ROUTING_DATASET:}
geo.routing.max-snap-distance-m=500
geo.routing.elevation-dataset=${geo.elevation.default-dataset}
